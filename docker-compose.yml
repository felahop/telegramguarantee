# The signer holds the hot-wallet keys: it lives only on the internal network (no internet access)
# and is reached by the worker with HMAC-signed requests.
name: escrow

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  volumes:
    - ./chains.yaml:/app/chains.yaml:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    networks: [default, internal]
    environment:
      POSTGRES_DB: escrow
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: escrow   # change in production (use a Docker secret)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrow -d escrow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  web:
    <<: *app
    # Telegram webhook (and, later, the CryptoBot webhook). Put it behind an HTTPS reverse proxy:
    # WEBHOOK_BASE_URL must be the public https:// address that forwards to this port.
    command: ["python", "-m", "app.web"]
    ports:
      - "8080:8080"
    depends_on:  # replaces the anchor's list, so repeat the databases
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    # Outbox notifications, deal timers, CryptoBot, ChainWatchers, on-chain payouts, reconciliation.
    command: ["python", "-m", "app.worker"]
    environment:
      SIGNER_URL: http://signer:8090
    networks: [default, internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  signer:
    <<: *app
    command: ["python", "-m", "app.signer"]
    networks: [internal]  # no route to the internet: keys cannot be sent anywhere from here
    volumes:
      - ./chains.yaml:/app/chains.yaml:ro
      - ./secrets/keystore:/app/secrets/keystore:ro
    environment:
      SIGNER_KEYSTORE_DIR: /app/secrets/keystore
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
